apiVersion: v1
kind: Namespace
metadata:
  name: data-processing
  labels:
    purpose: eval-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-generator
  namespace: data-processing
  labels:
    app: report-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report-generator
  template:
    metadata:
      labels:
        app: report-generator
    spec:
      containers:
      - name: app
        image: python:3.9-slim
        command:
        - python3
        - -c
        - |
          import time
          print("Starting report generator...")
          cache = []
          while True:
              cache.append("x" * 1048576)
              print(f"Cached {len(cache)} report chunks")
              time.sleep(1)
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "100m"
            memory: "60Mi"
          limits:
            cpu: "100m"
            memory: "60Mi"
