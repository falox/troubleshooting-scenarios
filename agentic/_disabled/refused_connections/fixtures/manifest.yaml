apiVersion: v1
kind: Namespace
metadata:
  name: ingress-layer
  labels:
    purpose: eval-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-proxy-config
  namespace: ingress-layer
data:
  app.yaml: |
    environment: production
    db_host: db-staging.internal
    db_port: 5432
    cache_host: redis-staging.internal
    cache_port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-proxy
  namespace: ingress-layer
  labels:
    app: gateway-proxy
    component: ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-proxy
  template:
    metadata:
      labels:
        app: gateway-proxy
        component: ingress
    spec:
      containers:
      - name: proxy
        image: python:3.11-alpine
        command: ["python3", "-u", "/opt/scripts/entrypoint.py"]
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: scripts
          mountPath: /opt/scripts
          readOnly: true
        - name: config
          mountPath: /config
          readOnly: true
        resources:
          requests:
            cpu: "10m"
            memory: "48Mi"
          limits:
            memory: "96Mi"
      volumes:
      - name: scripts
        configMap:
          name: gateway-proxy-entrypoint
          defaultMode: 0555
      - name: config
        configMap:
          name: gateway-proxy-config
