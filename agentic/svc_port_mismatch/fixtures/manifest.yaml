# The service selector is correct so endpoints exist, but targetPort 8081
# doesn't match the container's listening port 8080 — every connection
# through the service is refused. Distinct from svc-selector (zero
# endpoints): here the endpoints are present but point at the wrong port.
apiVersion: v1
kind: Namespace
metadata:
  name: notification-hub
  labels:
    purpose: eval-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier-app
  namespace: notification-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier-app
  template:
    metadata:
      labels:
        app: notifier-app
    spec:
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: notifier-svc
  namespace: notification-hub
spec:
  selector:
    app: notifier-app
  ports:
    - port: 8080
      targetPort: 8081
