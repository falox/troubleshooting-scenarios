apiVersion: v1
kind: Namespace
metadata:
  name: wrong-fix-trap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trap-config
  namespace: wrong-fix-trap
data:
  config.yaml: |
    mode: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trap-demo
  namespace: wrong-fix-trap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trap-demo
  template:
    metadata:
      labels:
        app: trap-demo
    spec:
      volumes:
        - name: config
          configMap:
            name: trap-config
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - >-
              if [ ! -f /etc/app/config.yaml ]; then
              echo "FATAL: required config file /etc/app/config.yaml not found" >&2;
              exit 1;
              fi;
              echo "config loaded";
              sleep infinity
          volumeMounts:
            - name: config
              mountPath: /etc/config
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "16Mi"
              cpu: "25m"
            limits:
              memory: "32Mi"
              cpu: "50m"
