apiVersion: v1
kind: Namespace
metadata:
  name: newsletter-sender
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsletter-sender
  namespace: newsletter-sender
spec:
  replicas: 0
  selector:
    matchLabels:
      app: newsletter-sender
  template:
    metadata:
      labels:
        app: newsletter-sender
    spec:
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
