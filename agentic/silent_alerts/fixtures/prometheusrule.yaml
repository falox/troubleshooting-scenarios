apiVersion: v1
kind: Namespace
metadata:
  name: email-dispatcher
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: email-dispatcher-rules
  namespace: email-dispatcher
spec:
  groups:
    - name: email-dispatcher.rules
      rules:
        - alert: PodMemoryHigh
          expr: container_memory_working_set_byte{namespace="email-dispatcher"} > 100000000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Pod memory usage is high
        - alert: PodRestartingTooOften
          expr: increase(kube_pod_container_status_restart_total{namespace="email-dispatcher"}[1h]) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Pod restarting too often
