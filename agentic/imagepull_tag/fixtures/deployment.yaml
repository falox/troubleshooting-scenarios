apiVersion: v1
kind: Namespace
metadata:
  name: asset-renderer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renderer-app
  namespace: asset-renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: renderer-app
  template:
    metadata:
      labels:
        app: renderer-app
    spec:
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27-fips
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
