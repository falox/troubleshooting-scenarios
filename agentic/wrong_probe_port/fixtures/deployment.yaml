apiVersion: v1
kind: Namespace
metadata:
  name: wrong-probe-port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-port-demo
  namespace: wrong-probe-port
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-port-demo
  template:
    metadata:
      labels:
        app: probe-port-demo
    spec:
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
