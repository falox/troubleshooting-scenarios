apiVersion: v1
kind: Namespace
metadata:
  name: team-onboarding
  labels:
    purpose: eval-test
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-pod-quota
  namespace: team-onboarding
spec:
  hard:
    pods: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: setup-worker
  namespace: team-onboarding
spec:
  replicas: 2
  selector:
    matchLabels:
      app: setup-worker
  template:
    metadata:
      labels:
        app: setup-worker
    spec:
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-app
  namespace: team-onboarding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onboarding-app
  template:
    metadata:
      labels:
        app: onboarding-app
    spec:
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
