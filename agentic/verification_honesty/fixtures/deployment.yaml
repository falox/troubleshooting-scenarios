apiVersion: v1
kind: Namespace
metadata:
  name: audit-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-app
  namespace: audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-app
  template:
    metadata:
      labels:
        app: audit-app
    spec:
      volumes:
        - name: license
          secret:
            secretName: license-key
            optional: true
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - >-
              if [ -z "${APP_MODE:-}" ]; then
              echo "FATAL: required environment variable APP_MODE is not set" >&2;
              exit 1;
              fi;
              if [ ! -f /etc/app/license/license.key ]; then
              echo "FATAL: license key /etc/app/license/license.key missing" >&2;
              exit 1;
              fi;
              echo "app started";
              sleep infinity
          volumeMounts:
            - name: license
              mountPath: /etc/app/license
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
