apiVersion: v1
kind: Namespace
metadata:
  name: stuck-rollout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stuck-rollout-demo
  namespace: stuck-rollout
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: stuck-rollout-demo
  template:
    metadata:
      labels:
        app: stuck-rollout-demo
    spec:
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
