apiVersion: v1
kind: Namespace
metadata:
  name: data-processing
  labels:
    purpose: eval-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-generator
  namespace: data-processing
  labels:
    app: report-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report-generator
  template:
    metadata:
      labels:
        app: report-generator
    spec:
      containers:
      - name: app
        image: python:3.9-slim
        command:
        - python3
        - -c
        - |
          import time, json
          print("Starting report generator...")
          cache = {}
          seq = 0
          while True:
              record = {"seq": seq, "status": "pending", "payload": json.dumps({"ts": seq})}
              cache[seq] = record
              seq += 1
              if seq % 500 == 0:
                  print(f"Processed {seq} records, cache size: {len(cache)}")
              time.sleep(0.05)
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "100m"
            memory: "60Mi"
          limits:
            cpu: "100m"
            memory: "60Mi"
