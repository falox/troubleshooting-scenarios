apiVersion: v1
kind: Namespace
metadata:
  name: onboarding-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-worker
  namespace: onboarding-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onboarding-worker
  template:
    metadata:
      labels:
        app: onboarding-worker
    spec:
      initContainers:
        - name: preflight
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/bash
            - -c
            - >-
              echo "Checking migration database connectivity...";
              (echo > /dev/tcp/db-legacy.internal/5432) 2>/dev/null ||
              { echo "ERROR: cannot reach migration database at
              db-legacy.internal:5432" >&2; exit 1; }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
