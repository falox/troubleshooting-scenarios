apiVersion: v1
kind: Namespace
metadata:
  name: event-processor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: event-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: event-processor-rules
  namespace: event-processor
spec:
  groups:
    - name: event-processor-minimal.rules
      rules:
        - record: namespace:container_cpu_usage:sum
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="event-processor"}[5m]))
