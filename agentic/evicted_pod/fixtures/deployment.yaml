apiVersion: v1
kind: Namespace
metadata:
  name: evicted-pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ephemeral-eviction-demo
  namespace: evicted-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ephemeral-eviction-demo
  template:
    metadata:
      labels:
        app: ephemeral-eviction-demo
    spec:
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 10Mi
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - >-
              echo "warming local cache (64Mi)...";
              dd if=/dev/zero of=/scratch/cache.dat bs=1M count=64;
              echo "cache ready";
              sleep infinity
          volumeMounts:
            - name: scratch
              mountPath: /scratch
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "50m"
