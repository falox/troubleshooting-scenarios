apiVersion: v1
kind: Namespace
metadata:
  name: imagepull-auth
  labels:
    purpose: eval-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull-auth-app
  namespace: imagepull-auth
  labels:
    app: imagepull-auth-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagepull-auth-app
  template:
    metadata:
      labels:
        app: imagepull-auth-app
    spec:
      containers:
        - name: internal-app
          image: quay.io/noexistingorg/internal-app:1.0
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
