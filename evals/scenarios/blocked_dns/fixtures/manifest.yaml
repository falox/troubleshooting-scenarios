apiVersion: v1
kind: Namespace
metadata:
  name: search-indexer
  labels:
    purpose: eval-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-app
  namespace: search-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer-app
  template:
    metadata:
      labels:
        app: indexer-app
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - >-
              while true; do
              if getent hosts kubernetes.default.svc.cluster.local >/dev/null 2>&1; then
              echo "DNS resolution OK";
              else
              echo "ERROR: DNS resolution failed for kubernetes.default.svc.cluster.local";
              fi;
              sleep 5;
              done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: baseline-network-policy
  namespace: search-indexer
spec:
  podSelector:
    matchLabels:
      app: indexer-app
  policyTypes:
    - Egress
  egress: []
