apiVersion: v1
kind: Namespace
metadata:
  name: credential-store
  labels:
    purpose: eval-test
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: credential-store
type: Opaque
stringData:
  username: app-user
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-app
  namespace: credential-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credential-app
  template:
    metadata:
      labels:
        app: credential-app
    spec:
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-creds
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-creds
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
