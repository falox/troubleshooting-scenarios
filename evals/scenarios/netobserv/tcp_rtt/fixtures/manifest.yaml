---
apiVersion: v1
kind: Namespace
metadata:
  name: latency-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: latency-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: python:3.12-alpine
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
          command: [/bin/sh, -c]
          args:
            - |
              cat >/tmp/server.py <<'PY'
              import time
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      time.sleep(0.35)
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"ok\n")
                  def log_message(self, *a): pass
              HTTPServer(("0.0.0.0", 8080), H).serve_forever()
              PY
              exec python /tmp/server.py
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-server
  namespace: latency-services
spec:
  selector:
    app: web-server
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-client
  namespace: latency-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-client
  template:
    metadata:
      labels:
        app: web-client
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
          command: [/bin/sh, -c]
          args:
            - |
              while true; do
                start=$(date +%s)
                if wget -q -O- -T 10 http://web-server:8080/; then
                  end=$(date +%s)
                  echo "request completed in $((end - start))s"
                else
                  echo "request failed"
                fi
                sleep 3
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
