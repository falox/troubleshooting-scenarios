---
apiVersion: v1
kind: Namespace
metadata:
  name: service-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-checker
  namespace: service-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-checker
  template:
    metadata:
      labels:
        app: service-checker
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prober
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]
          command: [/bin/sh, -c]
          args:
            - |
              echo "DNS checks active"
              i=0
              while true; do
                nslookup "service-${i}.example.invalid" 2>&1 || true
                nslookup "lookup-${i}.example.invalid" 2>&1 || true
                i=$((i + 1))
                sleep 1
              done
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
